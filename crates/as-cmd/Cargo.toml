[package]
name = "as-cmd"
description = "Command-line entry point for the Audio Share Server Core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "as-cmd"
path = "src/main.rs"

[dependencies]
audio-share-core.workspace = true
clap.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
v2-transport = { path = "../v2-transport" }
# Shared v2 Server runtime (identity, Pairing Core, QUIC listener, capture
# adapters) so the CLI and the GUI cannot diverge.
v2-runtime = { path = "../v2-runtime" }
# Terminal QR rendering for `as-cmd pair` (pure Rust, no default features).
qrcodegen = "1.8"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
protocol-harness = { path = "../../tools/protocol-harness" }
tempfile = "3"
tokio.workspace = true
# Real QUIC capture-failure regressions use fresh, in-memory Client keys.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
v2-transport = { path = "../v2-transport", features = ["test-support"] }
