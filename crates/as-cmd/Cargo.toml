[package]
name = "as-cmd"
description = "Command-line entry point for the Audio Share Server Core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "as-cmd"
path = "src/main.rs"

[dependencies]
audio-share-core.workspace = true
clap.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
protocol-harness = { path = "../../tools/protocol-harness" }
tempfile = "3"
tokio.workspace = true
