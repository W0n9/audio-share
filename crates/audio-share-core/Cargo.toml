[package]
name = "audio-share-core"
description = "Server Core for Audio Share: Wire Protocol, framing, and MTU segmentation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
if-addrs = "0.13"
prost.workspace = true
serde.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
ringbuf = "0.6"

[target.'cfg(windows)'.dependencies]
# Pinned deliberately: wasapi re-exports windows types, so windows must stay on
# the same 0.62.2 minor while wasapi is in use. Never bump this alone.
# wasapi 0.27 requires Rust 1.85, so Windows builds need 1.85+ even though the
# workspace MSRV is 1.75.
wasapi = "0.27.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
tempfile = "3"
