[package]
name = "v2-transport"
description = "Wire Protocol v2 transport for Audio Share: QUIC endpoint, server identity, framing, and resource limits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
prost.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing = "0.1"

# Production: the Server verifies Client proofs with ECDSA P-256 (pairing.md
# PR-9); the authorization store is JSON (pairing.md §8.1).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde.workspace = true
serde_json.workspace = true

# test-support feature (golden-vector replay harness only)
# Pinned deliberately: quinn re-exports rustls/pki-types types, so rustls and
# rustls-pki-types stay on the same minor while quinn 0.11 is in use.
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
# The live-QUIC driver tests sign the PR-9 auth_context with the fixture's
# TEST-ONLY client scalar (fixtures/wire-protocol-v2/test-keys.json), exactly
# as the Android client does.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Integration tests exercise the golden-vector replay harness, which lives
# behind the test-support feature; a self dev-dependency enables it for tests
# without exposing it to production builds (pairing.md §11.3 bypass rule).
v2-transport = { path = ".", features = ["test-support"] }

[features]
# Compile-time test-only support (golden-vector replay harness). Never enabled
# by production binaries (pairing.md §11.3: bypasses live behind compile-time
# test features). The crypto/serialization dependencies the harness shares
# with the production verification path are unconditional since ticket 07.
test-support = []
