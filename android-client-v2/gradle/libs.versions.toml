[versions]
# Stage 2: AGP 9 with built-in Kotlin, Gradle 9.7.1, Kotlin/KGP 2.4.21.
# Stage 3: compileSdk 37 / targetSdk 36 + Compose BOM 2026.09.00 (Compose 1.12).
# protobuf-kotlin-lite 4.28.2 + plugin 0.10.1 are unchanged from stage 1.
# Two ends, one .proto, one toolchain.
agp = "9.5.1"
kotlin = "2.4.21"
protobufPlugin = "0.10.1"
protobuf = "4.28.2"
junit = "4.13.2"
# Stage 3: 1.19.x folds core-ktx into androidx.core:core (core-ktx is an empty
# compatibility artifact), so the app depends on `androidx.core:core`.
core = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
camera = "1.6.2"
zxing = "3.5.3"
# Robolectric 4.18 supports SDK 36/37; SDK 36 tests require JDK 21.
robolectric = "4.18"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
google-protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
