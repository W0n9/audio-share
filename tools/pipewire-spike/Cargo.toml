[package]
name = "pipewire-spike"
description = "Linux PipeWire capture spike for the Audio Share server rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# The safe pipewire crate requires Rust 1.80; the rest of the workspace is 1.75.
rust-version = "1.80"

[[bin]]
name = "pipewire-spike"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
ringbuf = "0.6"

[dev-dependencies]
tempfile = "3"
