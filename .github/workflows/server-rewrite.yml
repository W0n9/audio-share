name: Server rewrite

on:
  push:
    branches:
      - integration/server-rewrite
      - "ticket/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "gui/**"
      - "tools/**"
      - "fixtures/**"
      - "scripts/**"
      - "VERSION"
      - "metadata/**"
      - "docs/server-rewrite/**"
      - ".github/workflows/server-rewrite.yml"
      - ".github/workflows/release.yml"
  # Reusable entry point for release.yml: it builds, tests, lints, and
  # packages the final Windows and Linux Server artifacts.
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install PipeWire headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Check version metadata is in sync with VERSION
        if: runner.os == 'Linux'
        run: |
          bash scripts/apply_version.sh
          git diff --exit-code -- \
            Cargo.toml Cargo.lock \
            gui/package.json gui/package-lock.json \
            gui/src-tauri/Cargo.toml gui/src-tauri/tauri.conf.json

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Hardware-free harness smoke test (serve-fake + replay)
        run: cargo test -p protocol-harness --test harness_smoke -- --nocapture

      - name: Replay committed fixtures offline
        run: cargo run -p protocol-harness -- replay --fixture fixtures/protocol/v0.3.4/linux/f32-48k-stereo

  windows-packaging:
    name: Windows portable packaging
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (Windows)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npm run build

      # Portable exe only: bundle.targets is [] and --no-bundle is explicit,
      # so no MSI/NSIS installer is produced.
      - name: Build portable GUI exe
        working-directory: gui
        run: npx tauri build --no-bundle

      - name: Build Windows as-cmd
        run: cargo build --release -p as-cmd

      - name: Assert workspace artifact paths
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/target/release/AudioShareServer.exe"
          test -f "$GITHUB_WORKSPACE/target/release/as-cmd.exe"

      - name: Self-test artifact packaging
        shell: bash
        run: bash scripts/package-windows-artifacts.test.sh

      - name: Package Windows artifacts
        shell: bash
        run: |
          bash scripts/package-windows-artifacts.sh \
            --root "$GITHUB_WORKSPACE" \
            --target-dir "$GITHUB_WORKSPACE/target/release" \
            --out-dir "$GITHUB_WORKSPACE/dist-windows"

      - name: Upload portable GUI exe
        uses: actions/upload-artifact@v4
        with:
          name: AudioShareServer-windows
          path: |
            dist-windows/AudioShareServer.exe
            dist-windows/AudioShareServer.exe.sha256
          if-no-files-found: error

      - name: Upload Windows as-cmd archive
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-server-cmd-windows
          path: |
            dist-windows/audio-share-server-cmd-windows.zip
            dist-windows/audio-share-server-cmd-windows.zip.sha256
          if-no-files-found: error

  linux-packaging:
    name: Linux deb/AppImage packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # WebKitGTK 4.1 and PipeWire are runtime dependencies of the bundles;
      # the -dev packages are needed to compile the Tauri shell and core.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libfuse2t64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npm run build

      # tauri.linux.conf.json sets bundle.targets = ["deb", "appimage"]; the
      # explicit --bundles keeps the invocation self-documenting.
      - name: Build Linux bundles (deb + AppImage)
        working-directory: gui
        run: npx tauri build --bundles deb,appimage

      - name: Build Linux as-cmd
        run: cargo build --release -p as-cmd

      - name: Self-test artifact packaging
        run: bash scripts/package-linux-artifacts.test.sh

      - name: Package Linux artifacts
        run: |
          bash scripts/package-linux-artifacts.sh \
            --root "$GITHUB_WORKSPACE" \
            --bundle-dir "$GITHUB_WORKSPACE/target/release/bundle" \
            --target-dir "$GITHUB_WORKSPACE/target/release" \
            --out-dir "$GITHUB_WORKSPACE/dist-linux" \
            --arch amd64

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-server-deb
          path: dist-linux/*.deb*
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-server-appimage
          path: dist-linux/*.AppImage*
          if-no-files-found: error

      - name: Upload Linux as-cmd archive
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-server-cmd-linux
          path: dist-linux/audio-share-server-cmd-linux.tar.gz*
          if-no-files-found: error
