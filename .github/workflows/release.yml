name: Make Release

# 只打包 Server 与 Android Client v2，不重建 v1 / F-Droid 产物。
# 默认仅上传 Actions artifacts；可选地创建 GitHub draft，不会自动发布或打标签。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '预期的产品/Server 版本（不带 v，必须与所选提交的 VERSION 一致）'
        required: true
        type: string
      create_draft:
        description: '创建 GitHub draft（要求远端标签已指向所选提交）'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: make-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release inputs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check product version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          bash scripts/check-release-version.sh "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release notes and remote tag before build
        if: inputs.create_draft
        shell: bash
        run: |
          notes="docs/releases/v$VERSION.md"
          if [[ ! -s "$notes" ]]; then
            printf '缺少 GitHub 发布说明：%s\n' "$notes" >&2
            exit 1
          fi
          bash scripts/check-release-tag.sh "v$VERSION" "$GITHUB_SHA"
        env:
          VERSION: ${{ steps.version.outputs.version }}

  build_server:
    name: Build and package Server
    needs: preflight
    uses: ./.github/workflows/server-rewrite.yml

  build_android:
    name: Build signed Android v2 APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, build-tools, and platform
        run: |
          sdkmanager --install \
            'ndk;27.2.12479018' \
            'build-tools;36.0.0' \
            'platforms;android-37.0'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-client-v2/native -> target

      - name: Decode release keystore from secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/audio-share-beta-keys"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/audio-share-beta-keys/audio-share-beta.jks"
          chmod 600 "$RUNNER_TEMP/audio-share-beta-keys/audio-share-beta.jks"

      # 覆盖 native/.cargo/config.toml 中的本机 NDK 路径，不改源码。
      - name: Build signed universal APK (arm64-v8a + x86_64)
        working-directory: android-client-v2
        env:
          AUDIO_SHARE_KEYSTORE_FILE: ${{ runner.temp }}/audio-share-beta-keys/audio-share-beta.jks
          AUDIO_SHARE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIO_SHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIO_SHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          export CC_x86_64_linux_android="$NDK/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$NDK/llvm-ar"
          ./gradlew assembleRelease -PandroidAbis=arm64-v8a,x86_64

      - name: Verify and package signed APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk_name=$(bash scripts/package-android-release.sh "$ANDROID_HOME/build-tools/36.0.0" \
            android-client-v2/app/build/outputs/apk/release dist-android)
          printf 'apk_name=%s\n' "$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-client-v2-android
          path: |
            dist-android/${{ steps.package.outputs.apk_name }}
            dist-android/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error

  create_release:
    name: Create draft release
    if: inputs.create_draft
    needs: [preflight, build_server, build_android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      APK_NAME: ${{ needs.build_android.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_bin

      - name: Verify assets and create GitHub draft
        run: bash scripts/create-draft-release.sh release_bin "$VERSION" "$APK_NAME" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
