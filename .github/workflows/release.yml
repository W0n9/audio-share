name: Make Release

# Server 0.5.0-beta + Android Client v2 beta release.
#
# The v1 Android Client (v0.3.4) and its existing release/F-Droid artifacts are
# not rebuilt or replaced here; they remain available as the compatibility
# fallback. This workflow only creates a draft GitHub Release on manual
# dispatch and never publishes it.
on:
  workflow_dispatch:

jobs:
  build_server:
    name: Build and package Server
    uses: ./.github/workflows/server-rewrite.yml

  build_android:
    name: Build signed Android beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, build-tools, and platform
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-client-v2/native -> target

      - name: Decode release keystore from secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/audio-share-beta-keys"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/audio-share-beta-keys/audio-share-beta.jks"
          chmod 600 "$RUNNER_TEMP/audio-share-beta-keys/audio-share-beta.jks"

      # native/.cargo/config.toml contains this developer machine's NDK paths.
      # The CARGO_TARGET_*_LINKER and CC_/AR_ variables below override them
      # without modifying the checked-in file.
      - name: Build signed universal APK (arm64-v8a + x86_64)
        working-directory: android-client-v2
        env:
          AUDIO_SHARE_KEYSTORE_FILE: ${{ runner.temp }}/audio-share-beta-keys/audio-share-beta.jks
          AUDIO_SHARE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIO_SHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIO_SHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          export CC_x86_64_linux_android="$NDK/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$NDK/llvm-ar"
          ./gradlew assembleRelease -PandroidAbis=arm64-v8a,x86_64

      - name: Verify APK signature, version, and ABI
        shell: bash
        run: |
          set -euo pipefail
          apk=android-client-v2/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | grep -q "package: name='dev.audioshare.v2' versionCode='2' versionName='0.2.0-beta'"
          echo "$badging" | grep -q "native-code: 'arm64-v8a' 'x86_64'"
          if unzip -p "$apk" 'classes*.dex' | strings | grep -qE 'TestSupportHarness|pinnedSpki|serverKey|smoke-client'; then
            echo 'error: test-support path found in production APK' >&2
            exit 1
          fi
          mkdir -p dist-android
          cp "$apk" dist-android/audio-share-client-v2-0.2.0-beta.apk
          (cd dist-android && sha256sum audio-share-client-v2-0.2.0-beta.apk \
            > audio-share-client-v2-0.2.0-beta.apk.sha256)

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-share-client-v2-android
          path: |
            dist-android/audio-share-client-v2-0.2.0-beta.apk
            dist-android/audio-share-client-v2-0.2.0-beta.apk.sha256
          if-no-files-found: error

  create_release:
    name: Create draft release
    needs: [build_server, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_bin

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash ./scripts/get_version.sh -n)

          # Android beta APK (new in 0.5.0-beta).
          test -f release_bin/audio-share-client-v2-android/audio-share-client-v2-0.2.0-beta.apk
          test -f release_bin/audio-share-client-v2-android/audio-share-client-v2-0.2.0-beta.apk.sha256

          # Server artifacts, unchanged from the 0.4.x release layout.
          test -f release_bin/AudioShareServer-windows/AudioShareServer.exe
          test -f release_bin/AudioShareServer-windows/AudioShareServer.exe.sha256
          test -f release_bin/audio-share-server-cmd-windows/audio-share-server-cmd-windows.zip
          test -f release_bin/audio-share-server-cmd-windows/audio-share-server-cmd-windows.zip.sha256
          test -f "release_bin/audio-share-server-deb/AudioShareServer_${version}_amd64.deb"
          test -f "release_bin/audio-share-server-deb/AudioShareServer_${version}_amd64.deb.sha256"
          test -f "release_bin/audio-share-server-appimage/AudioShareServer_${version}_amd64.AppImage"
          test -f "release_bin/audio-share-server-appimage/AudioShareServer_${version}_amd64.AppImage.sha256"
          test -f release_bin/audio-share-server-cmd-linux/audio-share-server-cmd-linux.tar.gz
          test -f release_bin/audio-share-server-cmd-linux/audio-share-server-cmd-linux.tar.gz.sha256

          for sum in release_bin/*/*.sha256; do
            (cd "$(dirname "$sum")" && sha256sum -c "$(basename "$sum")")
          done

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash ./scripts/get_version.sh -n)
          if [[ "$version" == *-* ]]; then
            # Pre-release versions have no metadata/F-Droid changelog entry.
            cat > notes <<'EOF'
          Wire Protocol v2 beta: encrypted, paired audio from a Server to one
          Android Client. The Android beta APK is signed with the dedicated beta
          key and installed alongside the v1 app (`dev.audioshare.v2`).

          v1 compatibility
          - v1 is frozen and still works; v1 is UNENCRYPTED and UNAUTHENTICATED
            and must be used only on a trusted network.
          - A v2 failure never falls back to v1, plaintext, or anonymous
            encryption.
          - The existing v1 APK (v0.3.4) and F-Droid release remain available.

          Known beta limitations
          - One Client per Server (no concurrent phones or multi-Client isolation).
          - No jitter buffer, packet-loss concealment, or clock-drift correction.
          - No diagnostics export, telemetry, or raw-audio recording.
          - No F-Droid distribution and no in-app auto-update.
          - No boot start or background restart after reboot.
          - Windows is smoke-tested only; Linux is the full-acceptance platform.

          Upgrade and rollback
          - Server: stop the old process, keep your existing config.ini and data
            directory, then replace the executable/package. Pairings and the
            Server identity stay in the data directory.
          - Android: install the signed beta APK next to v1. Earlier test builds
            signed with a debug key must be uninstalled first; uninstalling
            loses their pairing and the app must be paired again.
          - Rollback: reinstall the previous Server artifact and keep the v1 APK.
            A Server identity reset invalidates all v2 pairings and requires
            re-pairing.

          Verify every download with its SHA-256 checksum before installing.
          EOF
          else
            code=$(bash ./scripts/get_version.sh -c)
            changelog="metadata/en-US/changelogs/${code}.txt"
            test -f "$changelog"
            cp "$changelog" notes
          fi

      - name: Create GitHub draft release
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash ./scripts/get_version.sh -n)
          extra=()
          if [[ "$version" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "v$version" -d "${extra[@]}" -F notes -t "v$version" release_bin/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
