name: Make Release

# Server-only 0.4.0 release. The Android Client remains v0.3.4 and is not
# rebuilt or attached to this release.
on:
  workflow_dispatch:

jobs:
  build_server:
    name: Build and package Server
    uses: ./.github/workflows/server-rewrite.yml

  create_release:
    name: Create draft release
    needs: build_server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_bin

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash ./scripts/get_version.sh -n)

          test -f release_bin/AudioShareServer-windows/AudioShareServer.exe
          test -f release_bin/AudioShareServer-windows/AudioShareServer.exe.sha256
          test -f release_bin/audio-share-server-cmd-windows/audio-share-server-cmd-windows.zip
          test -f release_bin/audio-share-server-cmd-windows/audio-share-server-cmd-windows.zip.sha256
          test -f "release_bin/audio-share-server-deb/AudioShareServer_${version}_amd64.deb"
          test -f "release_bin/audio-share-server-deb/AudioShareServer_${version}_amd64.deb.sha256"
          test -f "release_bin/audio-share-server-appimage/AudioShareServer_${version}_amd64.AppImage"
          test -f "release_bin/audio-share-server-appimage/AudioShareServer_${version}_amd64.AppImage.sha256"
          test -f release_bin/audio-share-server-cmd-linux/audio-share-server-cmd-linux.tar.gz
          test -f release_bin/audio-share-server-cmd-linux/audio-share-server-cmd-linux.tar.gz.sha256

          # This release is Server-only: the v0.3.4 Android Client is unchanged.
          if find release_bin -name '*.apk' -print -quit | grep -q .; then
            echo 'error: an Android APK was attached to the Server-only release' >&2
            exit 1
          fi

          for sum in release_bin/*/*.sha256; do
            (cd "$(dirname "$sum")" && sha256sum -c "$(basename "$sum")")
          done

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          code=$(bash ./scripts/get_version.sh -c)
          notes="metadata/en-US/changelogs/${code}.txt"
          test -f "$notes"
          cp "$notes" notes

      - name: Create GitHub draft release
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash ./scripts/get_version.sh -n)
          gh release create "v$version" -d -F notes -t "v$version" release_bin/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
