name: Update SourceForge

# Sets the per-platform default downloads for the current VERSION. 0.4.0 is
# Server-only, so the script no longer points the android default at an APK;
# the Android Client remains v0.3.4.
on:
  workflow_dispatch:

jobs:
  set_default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/setup_sourceforge_release.sh "${{ secrets.SOURCEFORGE_RELEASE_API_KEY }}" "$(bash ./scripts/get_version.sh -n)"
