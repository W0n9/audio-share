[versions]
agp = "8.7.3"
kotlin = "2.0.21"

[libraries]
# Intentionally empty: the prototype uses framework APIs only (no androidx,
# no compose) so the empty-baseline APK isolates the native library cost.

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
